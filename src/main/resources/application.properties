spring.application.name=sistema-controle-pedidos

server.servlet.context-path=/sistema-controle-pedidos

spring.datasource.url=jdbc:postgresql://localhost:5433/POOW2
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver
server.error.include-stacktrace=never
server.port=8081
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=MinhaChaveSecretaSuperSegura123!
jwt.expiration=3600000

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

